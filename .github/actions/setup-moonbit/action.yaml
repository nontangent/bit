name: Setup MoonBit
description: Install the MoonBit toolchain (latest unless a version is given)

inputs:
  version:
    description: MoonBit toolchain version
    required: false
    # cli.moonbitlang.com answers 403 for every release except `latest`, so a
    # pinned version stops installing as soon as a newer one ships. Build on
    # latest and fix the code when a new compiler breaks it; pass `version`
    # only to try a specific release while it is still downloadable.
    default: "latest"

runs:
  using: composite
  steps:
    - name: Install MoonBit CLI (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        MOONBIT_INSTALL_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
        echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

    - name: Install MoonBit CLI (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        MOONBIT_INSTALL_VERSION: ${{ inputs.version }}
      run: |
        Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
        irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
        echo "$env:USERPROFILE\.moon\bin" |
          Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Report MoonBit version (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: moon version --all

    - name: Report MoonBit version (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: moon version --all
